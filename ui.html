<!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <title>Flashforge Control Center</title>
        <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg: #020502;
                --panel-bg: #060d06;
                --green-bright: #00ff66;
                --green-dim: #003311;
                --green-mid: #009944;
                --border-subtle: #004416;
            }

            body {
                background-color: var(--bg);
                color: var(--green-bright);
                font-family: 'VT323', monospace;
                font-size: 20px;
                margin: 0;
                padding: 12px;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                box-sizing: border-box;
            }

            header {
                width: 100%;
                max-width: 1200px;
                border-bottom: 1px solid var(--border-subtle);
                padding: 6px 4px;
                margin-bottom: 12px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                box-sizing: border-box;
            }

            h1 {
                font-family: 'Press Start 2P', monospace;
                font-size: 13px;
                margin: 0;
                color: var(--green-bright);
                letter-spacing: 1px;
            }

            .status-badge {
                font-size: 16px;
                color: var(--green-bright);
                background: var(--green-dim);
                padding: 2px 8px;
                border-left: 3px solid var(--green-bright);
            }

            /* Pure Flexbox Layout */
            .container {
                display: flex;
                gap: 12px;
                width: 100%;
                max-width: 1200px;
                flex-grow: 1;
            }

            /* Left side column (3) */
            .container > .box:nth-child(1) {
                flex: 3;
                min-width: 0;
            }

            /* Center column (2) */
            .container > .box:nth-child(2) {
                flex: 6;
                min-width: 0;
            }

            /* Right side log column (3) */
            .container > .box:nth-child(3) {
                flex: 3;
                min-width: 0;
            }

            .box {
                background: var(--panel-bg);
                border-left: 2px solid var(--border-subtle);
                padding: 12px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                box-sizing: border-box;
            }

            .box-title {
                font-size: 22px;
                margin-bottom: 4px;
                color: var(--green-bright);
                letter-spacing: 1px;
            }

            .log-text {
                font-size: 16px;
                color: var(--green-mid);
                line-height: 1.3;
                word-break: break-all;
            }

            .camera-error-box {
                display: flex;
                align-items: center;
                justify-content: center;
                aspect-ratio: 4 / 3;
                width: 100%;
                background: #000;
                color: var(--green-bright);
                font-family: 'Press Start 2P', monospace;
                font-size: 12px;
                text-align: center;
                border: 1px solid var(--border-subtle);
                box-sizing: border-box;
                letter-spacing: 2px;
                line-height: 1.8;
            }

            .ascii-window {
                background: #000;
                padding: 4px;
                position: relative;
                border: 1px solid var(--border-subtle);
            }

            .ascii-window::before {
                content: "[CAM_FEED_01]";
                position: absolute;
                top: -9px;
                left: 8px;
                background: var(--panel-bg);
                padding: 0 4px;
                font-size: 13px;
                color: var(--green-mid);
            }

            /* Aspect ratio preserved automatically */
            img {
                display: block;
                width: 100%;
                height: auto;
                aspect-ratio: 4 / 3;
                object-fit: contain;
            }

            .control-panel {
                background: var(--panel-bg);
                padding: 10px;
                border-top: 1px solid var(--border-subtle);
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            input[type="file"] {
                font-family: 'VT323', monospace;
                font-size: 18px;
                color: var(--green-bright);
                background: var(--bg);
                border: 1px solid var(--border-subtle);
                padding: 6px;
                width: 100%;
                box-sizing: border-box;
                cursor: pointer;
            }

            input[type="file"]::file-selector-button {
                font-family: 'VT323', monospace;
                font-size: 16px;
                background: var(--green-dim);
                color: var(--green-bright);
                border: none;
                padding: 4px 8px;
                cursor: pointer;
                margin-right: 6px;
            }

            .progress-container {
                background: var(--bg);
                border: 1px solid var(--border-subtle);
                padding: 4px;
                margin-top: 4px;
            }

            .progress-bar {
                background: var(--green-bright);
                height: 12px;
                width: 35%;
            }

            .progress-info {
                display: flex;
                justify-content: space-between;
                font-size: 14px;
                margin-top: 2px;
                color: var(--green-mid);
            }

            @media (max-width: 900px) {
                .container {
                    flex-direction: column;
                }
                .container > .box:nth-child(1),
                .container > .box:nth-child(2),
                .container > .box:nth-child(3) {
                    flex: 1 1 auto;
                }
            }
        </style>
    </head>
    <body>

        <header>
            <h1>SYS://FF_AD5M_TERMINAL</h1>
            <div class="status-badge">ONLINE</div>
        </header>

        <div class="container">
            <!-- Left Box: Printer Stats -->
            <div class="box">
                <div class="box-title">> PRINTER_STATS</div>
                <div id="printer-stats-content">
                    <div>STATE: <span style="color: var(--green-bright);">IDLE</span></div>
                    <div>NOZZLE_TEMP: 24.0°C / 200°C</div>
                    <div>BED_TEMP: 25.0°C / 60°C</div>
                    <div>FAN_SPEED: 0%</div>
                </div>
                
                <div style="margin-top: 10px;" class="box-title">> SYSTEM_NODES</div>
                <div class="log-text" id="system-nodes">
                    > ad5m_tcp: unreachable<br>
                    > pi_cam: unreachable<br>
                </div>
            </div>

            <!-- Center Box: Video Stream & File Upload + Progress Bar -->
            <div class="box" style="align-items: center; border-left: none; background: transparent; padding: 0;">
                <div class="ascii-window" style="width: 100%; box-sizing: border-box;" id="stream-wrapper">
                    <img src="/video_feed" width="640" height="480" id="video-element" onerror="showCameraError()" onload="cameraNodeStatus()">
                </div>
                
                <div class="control-panel" style="width: 100%; box-sizing: border-box; margin-top: 8px;">
                    <div style="font-size: 20px; color: var(--green-bright);">// INJECT GCODE PAYLOAD</div>
                    <input type="file" id="payload-file" onchange="fileUploadHandler()">
                    
                    <div style="margin-top: 4px;">
                        <div style="font-size: 16px; margin-bottom: 2px;">PRINT PROGRESS</div>
                        <div class="progress-container">
                            <div class="progress-bar" style="width: 35%;"></div>
                        </div>
                        <div class="progress-info">
                            <span>JOB: NONE</span>
                            <span>ETA: 01h 42m</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Box: Event Log with Upload & Pi Receipt Triggers -->
            <div class="box">
                <div class="box-title">> EVENT_LOG</div>
                <div id="event-log-content" class="log-text" style="font-size: 15px;">
                </div>
            </div>
        </div>

        <script>
            function showCameraError() {
                const wrapper = document.getElementById('stream-wrapper');
                wrapper.innerHTML = `
                    <div class="camera-error-box">
                        [CAMERA NOT FOUND]
                    </div>
                `;
                let curr = document.getElementById("system-nodes").innerHTML.split("<br>");
                document.getElementById("system-nodes").innerHTML = curr[0]+"<br>> pi_cam: unreachable<br>";
            }

            function cameraNodeStatus() {
                let curr = document.getElementById("system-nodes").innerHTML.split("<br>");
                document.getElementById("system-nodes").innerHTML = curr[0]+"<br>> pi_cam: streaming<br>";
            }

            function fileUploadHandler() {
                const fileInput = document.getElementById('payload-file');
                if (fileInput.files.length > 0) {
                    const fileName = fileInput.files[0].name;
                    const logContainer = document.getElementById('event-log-content');
                    const timestamp = new Date().toTimeString().split(' ')[0];
                    
                    logContainer.innerHTML += `<br>[${timestamp}] File selected: ${fileName}`;
                    logContainer.innerHTML += `<br>[${timestamp}] Pi payload buffer received successfully.`;//move to actual python backend
                }
            }

            function addLog(logMessage){
                        
                logContainer.innerHTML += `${logMessage}<br>`;
                logContainer.scrollTop = logContainer.scrollHeight;
            }

            async function fetchInitialLogs() {
                try {
                    const response = await fetch('/logs');
                    const logs = await response.json();
                    const logContainer = document.getElementById('event-log-content');
                    for (let i=0; i<logs.length; i++) {
                        addLog(logs[i]);
                    }
                } catch (err) {
                    console.error('Error loading initial logs:', err);
                }
            }

            fetchInitialLogs();

            const logContainer = document.getElementById('event-log-content');
            const logEvtSource = new EventSource('/stream_logs');
            logEvtSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                logContainer.innerHTML += `<br>${data.log}`;
                logContainer.scrollTop = logContainer.scrollHeight;
            };

            const printerStatsContainer = document.getElementById('printer-stats-content');
            const printerEvtSource = new EventSource('/printer_stats');
            printerEvtSource.onmessage = function(event){
                const data = JSON.parse(event.data);

                if (data.state == "NOT_FOUND" || data.state == "UNKNOWN" || data.state == "ERROR"){
                    printerStatsContainer.innerHTML = `<div>STATE: <span style="color: var(--green-bright);">${data.state}</span></div>`;
                } else {
                    printerStatsContainer.innerHTML = `
                        <div>STATE: <span style="color: var(--green-bright);">${data.state}</span></div>
                        <div>NOZZLE_TEMP: 24.0°C / 200°C</div>
                        <div>BED_TEMP: 25.0°C / 60°C</div>
                        <div>FAN_SPEED: 0%</div>
                    `;
                }
                printerStatsContainer.scrollTop = logContainer.scrollHeight;
            }
        </script>

    </body>
    </html>
